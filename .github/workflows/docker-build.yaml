name: Docker Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: [self-hosted, zammad]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: |
         SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
         IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/zammad" | tr '[:upper:]' '[:lower:]')

         docker build \
          --build-arg COMMIT_SHA=$SHORT_SHA \
          -t $IMAGE_NAME:$SHORT_SHA \
          -t $IMAGE_NAME:latest \
          .

      - name: Push Image
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/zammad" | tr '[:upper:]' '[:lower:]')

          docker push $IMAGE_NAME:$SHORT_SHA
          docker push $IMAGE_NAME:latest

