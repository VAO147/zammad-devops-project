name: Docker Build

on:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: [self-hosted, zammad]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker version
        run: docker --version

      - name: Docker Build
        run: |
          docker build \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -t zammad-test:${{ github.sha }} .
            
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zammad-test:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'