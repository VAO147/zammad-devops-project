name: Docker Build

on:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: [self-hosted, zammad]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker version
        run: docker --version

      - name: Docker Build
        run: |
          docker build \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -t zammad-test:${{ github.sha }} .